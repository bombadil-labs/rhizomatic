# The parity contract, enforced mechanically: every witness must pass its full green-gate,
# and the committed vectors must be exactly what the generator produces (no stale vectors).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript witness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: implementations/ts/package-lock.json
      - run: npm ci
      - name: green-gate (format + lint + typecheck + tests)
        run: npm run check
      - name: playground bundles
        run: npm run playground:build
      - name: docs are fresh (tour + playground bundles == committed bytes)
        run: |
          npm run docs:build
          git diff --exit-code ../../docs
      - name: vectors are fresh (generator output == committed bytes)
        run: |
          npm run gen-vectors
          npm run gen-command-vectors
          git diff --exit-code ../../vectors
          git diff --exit-code ../../contracts/command/coverage.json ../../contracts/command/TOWERS.json

  rust:
    name: Rust witness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementations/rust
      - name: green-gate (fmt + clippy + tests)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: WASM witness builds (the tour's second witness, docs/rust-witness.wasm)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
          cargo build --release --target wasm32-unknown-unknown
      - name: Save tour WASM witness
        uses: actions/upload-artifact@v4
        with:
          name: rust-witness-wasm
          path: implementations/rust/target/wasm32-unknown-unknown/release/rhizomatic.wasm
          if-no-files-found: error

  haskell:
    name: Haskell witness (L0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/haskell
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4"
      - name: green-gate (compile -Wall -Werror + tests)
        run: node check.mjs

  elixir:
    name: Elixir witness (L0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/elixir
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: green-gate (format + tests)
        run: |
          mix format --check-formatted
          mix test

  command:
    name: Command profile and mixed towers
    needs: [typescript, rust, haskell, elixir]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: implementations/ts/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementations/rust
      - run: npm ci --prefix implementations/ts
      - name: Acceptance harness, boundary negatives and planning regressions
        run: |
          node --test tools/command-tower*.test.mjs tools/check-rust-command-boundaries.test.mjs tools/check-command-bootstrap.test.mjs tools/check-command-acceptance.test.mjs tools/command-inventory.test.mjs
      - name: Record exact checked-out existing witness results
        env:
          CI_COMMIT: ${{ github.sha }}
          CI_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_TS: ${{ needs.typescript.result }}
          CI_RUST: ${{ needs.rust.result }}
          CI_HASKELL: ${{ needs.haskell.result }}
          CI_ELIXIR: ${{ needs.elixir.result }}
          CI_EVIDENCE: ${{ runner.temp }}/command-existing-conformance.json
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(commit!==process.env.CI_COMMIT)throw Error('CI checkout does not match witness SHA');
          const jobs={ts:'TypeScript witness',rust:'Rust witness',haskell:'Haskell witness (L0)',elixir:'Elixir witness (L0)'};
          const witnesses=Object.entries(jobs).map(([id,job])=>{
            if(process.env['CI_'+id.toUpperCase()]!=='success')throw Error('required existing witness failed: '+id);
            return {id,job,status:'passed'};
          });
          writeFileSync(process.env.CI_EVIDENCE,JSON.stringify({format:'rhizomatic-existing-conformance/1',commit,runUrl:process.env.CI_RUN_URL,witnesses},null,2)+'\n');
          JS
      - name: Execute all technical cases, faults, fixed routes, three towers and exact replay
        run: node tools/check-command-acceptance.mjs --out "$RUNNER_TEMP/command-acceptance" --seed "command-profile-1:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}" --conformance "$RUNNER_TEMP/command-existing-conformance.json"
      - name: Retain concrete plans, stage artifacts, faults and exact-head coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-profile-evidence
          path: |
            ${{ runner.temp }}/command-acceptance
            ${{ runner.temp }}/command-existing-conformance.json
          if-no-files-found: error
